<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Controle stofafbakening</title>
<style>
  :root {
    --inkt: #1C3A5E; --inkt-zacht: #4C6885; --lijn: #DCE6F1; --wit: #fff;
    --achtergrond: #F5F8FB; --terra: #C57B5C; --goed: #4E927B; --fout: #B2503A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--achtergrond); color: var(--inkt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 32px 0 10px; }
  .sub { color: var(--inkt-zacht); margin: 0 0 20px; font-size: 13px; }
  .kies { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  select, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--lijn); background: var(--wit); color: var(--inkt); }
  button { cursor: pointer; border-color: var(--inkt); }
  .kaarten { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .kaart { background: var(--wit); border: 1px solid var(--lijn); border-radius: 10px; padding: 14px 16px; }
  .kaart .label { font-size: 12px; color: var(--inkt-zacht); margin-bottom: 6px; }
  .kaart .getallen { font-size: 13px; }
  .kaart .totaal { font-size: 22px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; background: var(--wit); border: 1px solid var(--lijn); border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--lijn); }
  th { background: #EEF3F8; font-weight: 600; font-size: 12px; color: var(--inkt-zacht); }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .ja { color: var(--goed); font-weight: 600; }
  .nee { color: var(--fout); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #FBEFEA; color: var(--fout); margin-left: 6px; }
  .fout-melding { background: #FBEFEA; border: 1px solid #E8C9BE; border-radius: 10px; padding: 14px 16px; color: var(--fout); }
  .uitleg { color: var(--inkt-zacht); font-size: 12.5px; margin: 6px 0 14px; max-width: 70ch; }
  code { background: #EEF3F8; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .check-ok { background: #EAF2EF; border: 1px solid #B9D9CD; border-radius: 10px; padding: 12px 16px; color: var(--goed); font-size: 13px; margin-bottom: 20px; }
  .check-fout { background: #FBEFEA; border: 1px solid #E8C9BE; border-radius: 10px; padding: 12px 16px; color: var(--fout); font-size: 13px; margin-bottom: 20px; font-weight: 600; }
  .kaart-groot { border-color: var(--goed); border-width: 2px; }
  .kaart-groot .totaal { font-size: 34px; color: var(--goed); }
</style>
</head>
<body>
  <h1>Controle stofafbakening</h1>
  <p class="sub">Interne controleweergave — niet gelinkt vanuit het menu, niet bedoeld voor leerlingen.</p>

  <div id="regressie"></div>

  <div class="kies">
    <label for="toetsKeuze">Toets:</label>
    <select id="toetsKeuze"></select>
    <button id="ververs">Vernieuwen</button>
  </div>

  <div id="inhoud"></div>

<script src="scripts/stofafbakening.js"></script>
<script src="scripts/boeklabel.js"></script>
<script>
// Handmatig bijhouden welke toetsen er zijn (dezelfde bestanden als toetsen/*.json).
// Alleen voor het keuzemenu van deze controlepagina.
const BEKENDE_TOETSEN = ["4h-pw-m1-h1h2"];

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function laadStofdataVoor(toetsId) {
  const toets = await fetch(`toetsen/${toetsId}.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("toets: HTTP " + r.status); return r.json(); });
  if (!toets.boek || !toets.stofafbakening) throw new Error("geen boek/stofafbakening");
  const [index, onderwerpen] = await Promise.all([
    fetch(`index-${toets.boek}.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("index: HTTP " + r.status); return r.json(); }),
    fetch(`onderwerpen-${toets.boek}.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("onderwerpen: HTTP " + r.status); return r.json(); })
  ]);
  return { toets, index, onderwerpen };
}

// ---------------------------------------------------------------------------
// Regressiecheck: vaste, met de hand nagerekende controlegetallen voor
// 4H-PW-M1-H1H2, hardgecodeerd. Slaagt of faalt zichtbaar, onafhankelijk van
// welke toets er in het keuzemenu hieronder staat — zodat een latere
// wijziging aan de logica (in scripts/stofafbakening.js) meteen opvalt.
// ---------------------------------------------------------------------------
const VERWACHT_4H_PW_M1_H1H2 = { binnenStofafbakening: 318, aftrekking: 56, adviespool: 262, alleenGeenAdvies: 109, strengeAdviespool: 153 };

async function voerRegressiecheckUit() {
  const el = document.getElementById("regressie");
  try {
    const { toets, index, onderwerpen } = await laadStofdataVoor("4h-pw-m1-h1h2");
    const b = berekenStofafbakening(toets.stofafbakening, toets.vragen, onderwerpen, index);
    const alleCodes = [...b.stofCodes];
    const gevonden = {
      binnenStofafbakening: b.somVan(alleCodes).totaal,
      aftrekking: b.somVan(b.nietGetoetstCodes).totaal,
      adviespool: b.somVan(alleCodes).totaal - b.somVan(b.nietGetoetstCodes).totaal,
      alleenGeenAdvies: b.somVan(b.alleenGeenAdvies).totaal,
      strengeAdviespool: b.somVan(alleCodes).totaal - b.somVan(b.strengNietGetoetstCodes).totaal
    };
    const verschillen = Object.keys(VERWACHT_4H_PW_M1_H1H2).filter(k => VERWACHT_4H_PW_M1_H1H2[k] !== gevonden[k]);
    if (verschillen.length === 0) {
      el.innerHTML = `<div class="check-ok">✓ Regressiecheck geslaagd — 4H-PW-M1-H1H2 geeft nog steeds 318 / 56 / 262 / 109 / 153.</div>`;
    } else {
      el.innerHTML = `<div class="check-fout">✗ Regressiecheck GEFAALD — de berekening is veranderd: ${esc(verschillen.map(k => `${k} verwacht ${VERWACHT_4H_PW_M1_H1H2[k]}, nu ${gevonden[k]}`).join("; "))}</div>`;
    }
  } catch (e) {
    el.innerHTML = `<div class="check-fout">✗ Regressiecheck kon niet draaien: ${esc(e.message)}</div>`;
  }
}

const select = document.getElementById("toetsKeuze");
BEKENDE_TOETSEN.forEach(id => {
  const o = document.createElement("option");
  o.value = id; o.textContent = id;
  select.appendChild(o);
});

const zoek = new URLSearchParams(location.search);
const gevraagd = zoek.get("toets");
if (gevraagd && BEKENDE_TOETSEN.includes(gevraagd)) select.value = gevraagd;

select.addEventListener("change", () => laad(select.value));
document.getElementById("ververs").addEventListener("click", () => laad(select.value));

async function laad(toetsId) {
  const inhoud = document.getElementById("inhoud");
  inhoud.innerHTML = "<p>Bezig met laden…</p>";
  history.replaceState(null, "", "?toets=" + encodeURIComponent(toetsId));

  let toets, index, onderwerpen;
  try {
    ({ toets, index, onderwerpen } = await laadStofdataVoor(toetsId));
  } catch (e) {
    inhoud.innerHTML = `<div class="fout-melding">Kon de toets of stofdata niet laden: ${esc(e.message)}</div>`;
    return;
  }

  // ---- Gedeelde logica met feedbacktool.html, zie scripts/stofafbakening.js ----
  const b = berekenStofafbakening(toets.stofafbakening, toets.vragen, onderwerpen, index);
  const hoofdstukken = Array.isArray(toets.stofafbakening.hoofdstukken) ? toets.stofafbakening.hoofdstukken : [];
  const extra = Array.isArray(toets.stofafbakening.extra) ? toets.stofafbakening.extra : [];
  const alleCodes = [...b.stofCodes].sort();

  const totaalBinnen = b.somVan(alleCodes);
  const aftrekking = b.somVan(b.nietGetoetstCodes);
  const adviespool = { pe: totaalBinnen.pe - aftrekking.pe, boekje: totaalBinnen.boekje - aftrekking.boekje, totaal: totaalBinnen.totaal - aftrekking.totaal };
  const strengeAftrek = b.somVan(b.strengNietGetoetstCodes);
  const strengeAdviespool = { pe: totaalBinnen.pe - strengeAftrek.pe, boekje: totaalBinnen.boekje - strengeAftrek.boekje, totaal: totaalBinnen.totaal - strengeAftrek.totaal };
  const alleenGeenAdviesSom = b.somVan(b.alleenGeenAdvies);

  const labelVan = code => { const o = (onderwerpen.onderwerpen || []).find(x => x.id === code); return o ? o.label : code; };

  // ---- Renderen ----
  const kaart = (label, t, groot) => `<div class="kaart${groot ? " kaart-groot" : ""}"><div class="label">${esc(label)}</div>
    <div class="totaal">${t.totaal}</div>
    <div class="getallen">PE: ${t.pe} · boekje: ${t.boekje}</div></div>`;

  const rijenHtml = alleCodes.map(c => {
    const opToets = b.getoetst.has(c);
    const status = !opToets ? `<span class="nee">nee</span>`
      : (b.alleenGeenAdvies.includes(c) ? `<span class="ja">ja</span><span class="badge">alleen geenOefenadvies</span>` : `<span class="ja">ja</span>`);
    const r = b.telOpgaven(c);
    return `<tr>
      <td><code>${esc(c)}</code></td>
      <td>${esc(labelVan(c))}</td>
      <td class="num">${r.pe}</td>
      <td class="num">${r.boekje}</td>
      <td class="num">${r.totaal}</td>
      <td>${status}</td>
    </tr>`;
  }).join("");

  // Het label waarmee het lesboek in de feedback naar leerlingen wordt
  // genoemd. Hier zichtbaar gemaakt zodat je vóór publicatie ziet wat er
  // komt te staan: staat er geen lesboeklabel in de index, dan leidt de tool
  // er zelf een af uit titel en niveau, en dat is niet altijd wat je wilt.
  const boekLabel = lesboekLabelVan(index.boek);
  const boekLabelBron = lesboekLabelIsExpliciet(index.boek)
    ? 'uit <code>lesboeklabel</code> in de index'
    : '<strong>afgeleid</strong> uit titel en niveau — zet <code>lesboeklabel</code> in de index als dit niet de naam is die leerlingen moeten lezen';

  inhoud.innerHTML = `
    <p class="sub"><strong>${esc(toets.titel || toets.toets || toetsId)}</strong> — boek <code>${esc(toets.boek)}</code>,
      hoofdstukken ${esc(hoofdstukken.join(", "))}${extra.length ? ", extra " + esc(extra.join(", ")) : ""},
      ${alleCodes.length} onderwerpen binnen de stofafbakening.</p>

    <h2>Hoe het lesboek heet in de feedback</h2>
    <p class="uitleg">Leerlingen lezen bij elke oefenverwijzing “<strong>${esc(boekLabel)}:</strong> opgave …”. Dat label is ${boekLabelBron}.</p>

    <h2>Binnen de stofafbakening</h2>
    <div class="kaarten">${kaart("Totaal opgaven", totaalBinnen)}</div>

    <h2>Aftrekking — onderwerpen die niet op deze toets voorkomen</h2>
    <div class="kaarten">${kaart("Aftrekking", aftrekking)}</div>
    <p class="uitleg">Codes: ${b.nietGetoetstCodes.length ? esc(b.nietGetoetstCodes.join(", ")) : "(geen)"}</p>

    <h2>Adviespool</h2>
    <div class="kaarten">
      ${kaart("Bereikbare adviespool (excl. alleen-geenOefenadvies)", strengeAdviespool, true)}
      ${kaart("Tussenstap — zo rekent de tool nu voor 'Niet alle stof is getoetst'", adviespool)}
    </div>
    <p class="uitleg">De tool zelf blijft rekenen met de tussenstap (262) voor de lijst die leerlingen zien — dat is niet veranderd. De bereikbare adviespool (153) is wat overblijft als je de onderwerpen die uitsluitend in een geenOefenadvies-vraag voorkomen er ook uit haalt; die onderwerpen leveren toch nooit advies op.</p>

    <h2>Apart: onderwerpen die uitsluitend in een geenOefenadvies-vraag voorkomen</h2>
    <div class="kaarten">${kaart("Opgaven van deze onderwerpen", alleenGeenAdviesSom)}</div>
    <p class="uitleg">Codes: ${b.alleenGeenAdvies.length ? esc(b.alleenGeenAdvies.join(", ")) : "(geen)"} — deze onderwerpen worden nu wél als "getoetst" gerekend (zie kolom hieronder), maar leveren nooit oefenadvies op omdat de enige vraag die ze noemt geen advies toont.</p>

    <h2>Per onderwerp</h2>
    <table>
      <thead><tr><th>Code</th><th>Label</th><th class="num">PE</th><th class="num">Boekje</th><th class="num">Totaal</th><th>Op toets?</th></tr></thead>
      <tbody>${rijenHtml}</tbody>
    </table>
  `;
}

voerRegressiecheckUit();
if (select.value) laad(select.value);
else if (BEKENDE_TOETSEN.length) { select.value = BEKENDE_TOETSEN[0]; laad(select.value); }
</script>
</body>
</html>
